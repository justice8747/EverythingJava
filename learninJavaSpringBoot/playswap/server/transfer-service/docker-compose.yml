services:
  postgres-transfer:
    container_name: playswap-postgres-transfer
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: playswap_transfer
    ports:
      - "5434:5432"
    volumes:
      - ./volume-data/postgres_transfer_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5