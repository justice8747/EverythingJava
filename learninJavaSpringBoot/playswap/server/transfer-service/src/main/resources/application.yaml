server:
  port: 8083

spring:
  application:
    name: transfer-service

  main:
    web-application-type: reactive

  datasource:
    url: ${DB_AUTH_URL:jdbc:postgresql://localhost:5432/playswap_transfer}
    username: ${DB_AUTH_USERNAME:postgres}
    password: ${DB_AUTH_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

services:
  spotify-service-url: http://localhost:8082
  ytmusic-service-url: http://localhost:8081

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized