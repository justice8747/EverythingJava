services:
  postgres-auth:
    container_name: playswap-postgres-auth
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: playswap_auth
    ports:
      - "5433:5432"
    volumes:
      - ./volume-data/postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5