server:
  port: 8081

services:
  auth-service-url: http://localhost:8080

app:
  internal-api-secret: ${INTERNAL_API_SECRET:playswap-internal-secret-2026-jussy8747}

spring:
  application:
    name: ytmusic-service
  codec:
    max-in-memory-size: 16MB

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
