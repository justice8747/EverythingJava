version: '3.8'

services:
  # -------------------------------------------------------
  # Database Service (PostgreSQL - Internal Only)
  # -------------------------------------------------------
  playswap-db:
    image: postgres:16-alpine
    container_name: playswap-db
    restart: always
    environment:
      POSTGRES_DB: playswap
      POSTGRES_USER: ${DB_AUTH_USERNAME:?DB_AUTH_USERNAME environment variable is required}
      POSTGRES_PASSWORD: ${DB_AUTH_PASSWORD:?DB_AUTH_PASSWORD environment variable is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/01-init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh
      - ./auth-service/auth_service_data.sql:/docker-entrypoint-initdb.d/auth_service_data.sql
      - ./transfer-service/transfer_service_data.sql:/docker-entrypoint-initdb.d/transfer_service_data.sql
      - ./transfer-service/src/main/resources/schema_indexes.sql:/docker-entrypoint-initdb.d/schema_indexes.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_AUTH_USERNAME:?DB_AUTH_USERNAME environment variable is required}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------
  # Service Discovery (Eureka Server - Internal Only)
  # -------------------------------------------------------
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------
  # API Gateway (Public Entry Point)
  # -------------------------------------------------------
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: always
    ports:
      - "9000:9000"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    depends_on:
      eureka-server:
        condition: service_healthy

  # -------------------------------------------------------
  # Auth Microservice (Internal Only)
  # -------------------------------------------------------
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: always
    environment:
      DB_AUTH_URL: jdbc:postgresql://playswap-db:5432/playswap_auth
      DB_AUTH_USERNAME: ${DB_AUTH_USERNAME:?DB_AUTH_USERNAME environment variable is required}
      DB_AUTH_PASSWORD: ${DB_AUTH_PASSWORD:?DB_AUTH_PASSWORD environment variable is required}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:?SPOTIFY_CLIENT_ID environment variable is required}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:?SPOTIFY_CLIENT_SECRET environment variable is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID environment variable is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET environment variable is required}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET environment variable is required}
    depends_on:
      playswap-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  # -------------------------------------------------------
  # Spotify Microservice (Internal Only)
  # -------------------------------------------------------
  spotify-service:
    build:
      context: ./spotify-service
      dockerfile: Dockerfile
    container_name: spotify-service
    restart: always
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SERVICES_AUTH_SERVICE_URL: http://auth-service:8080
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET environment variable is required}
    depends_on:
      eureka-server:
        condition: service_healthy

  # -------------------------------------------------------
  # YouTube Music Microservice (Internal Only)
  # -------------------------------------------------------
  ytmusic-service:
    build:
      context: ./ytmusic-service
      dockerfile: Dockerfile
    container_name: ytmusic-service
    restart: always
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SERVICES_AUTH_SERVICE_URL: http://auth-service:8080
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET environment variable is required}
    depends_on:
      eureka-server:
        condition: service_healthy

  # -------------------------------------------------------
  # Transfer Execution Microservice (Internal Only)
  # -------------------------------------------------------
  transfer-service:
    build:
      context: ./transfer-service
      dockerfile: Dockerfile
    container_name: transfer-service
    restart: always
    environment:
      DB_AUTH_URL: jdbc:postgresql://playswap-db:5432/playswap_transfer
      DB_AUTH_USERNAME: ${DB_AUTH_USERNAME:?DB_AUTH_USERNAME environment variable is required}
      DB_AUTH_PASSWORD: ${DB_AUTH_PASSWORD:?DB_AUTH_PASSWORD environment variable is required}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SERVICES_SPOTIFY_SERVICE_URL: http://spotify-service:8082
      SERVICES_YTMUSIC_SERVICE_URL: http://ytmusic-service:8081
    depends_on:
      playswap-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

volumes:
  postgres_data:
